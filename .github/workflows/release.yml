name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # WINDOWS x64 (MSVC 2019)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Installer Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtserialport'
          cache: true
          install-deps: true

      - name: Configurer MSVC 2019
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2019'

      - name: Compiler (Release)
        shell: cmd
        run: |
          qmake CourseOrientation.pro CONFIG+=release
          nmake release

      - name: Packager avec windeployqt
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "CourseOrientation.exe" |
                 Where-Object { $_.FullName -like "*release*" } |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "CourseOrientation.exe introuvable !"
            exit 1
          }
          Write-Host "EXE trouvé : $($exe.FullName)"

          $dist = "dist\CourseOrientation"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item $exe.FullName "$dist\"

          windeployqt --release --no-translations --no-system-d3d-compiler `
                      --no-opengl-sw "$dist\CourseOrientation.exe"

          # Vérifier que les DLL Qt ont été copiées
          $dllCount = (Get-ChildItem "$dist\*.dll").Count
          Write-Host "Nombre de DLL copiées : $dllCount"
          if ($dllCount -lt 3) {
            Write-Error "windeployqt n'a copié aucune DLL — packaging incomplet"
            exit 1
          }

      - name: Créer l'archive ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "linux") { $tag = "${{ inputs.version }}" }
          if (-not $tag) { $tag = "v1.0.0" }
          $zipName = "CourseOrientation-${tag}-windows-x64.zip"
          Compress-Archive -Path "dist\CourseOrientation\*" `
                           -DestinationPath $zipName -Force
          Write-Host "ZIP créé : $zipName"
          Get-ChildItem $zipName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: CourseOrientation-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # LINUX x86_64 (Ubuntu 22.04)
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libegl-dev libgles2-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xkb-dev \
            libudev-dev libfontconfig1-dev libdbus-1-dev \
            libmysqlclient-dev wget

      - name: Installer Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtserialport'
          cache: true
          install-deps: true

      - name: Compiler (Release)
        run: |
          qmake CourseOrientation.pro CONFIG+=release
          make -j$(nproc)
          ls -la CourseOrientation

      - name: Packager en tarball portable
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "linux" ]; then TAG="${{ inputs.version }}"; fi
          if [ -z "$TAG" ]; then TAG="v1.0.0"; fi

          DIST="CourseOrientation-${TAG}-linux-x86_64"
          mkdir -p "$DIST/lib" "$DIST/plugins"

          # Binaire
          cp CourseOrientation "$DIST/"

          # Bibliothèques Qt nécessaires
          QT_LIB="$Qt6_DIR/lib"
          for lib in Qt6Core Qt6Gui Qt6Widgets Qt6Network Qt6Sql Qt6SerialPort Qt6Concurrent Qt6DBus Qt6XcbQpa; do
            cp "${QT_LIB}/lib${lib}.so.6" "$DIST/lib/" 2>/dev/null || true
          done

          # Plugins SQL et plateforme
          mkdir -p "$DIST/plugins/sqldrivers" "$DIST/plugins/platforms" "$DIST/plugins/imageformats"
          cp "$Qt6_DIR/plugins/sqldrivers/libqsqlite.so" "$DIST/plugins/sqldrivers/" 2>/dev/null || true
          cp "$Qt6_DIR/plugins/platforms/libqxcb.so"     "$DIST/plugins/platforms/" 2>/dev/null || true
          cp "$Qt6_DIR/plugins/imageformats/"*.so         "$DIST/plugins/imageformats/" 2>/dev/null || true

          # Bibliothèques XCB nécessaires pour libqxcb
          ldd "$Qt6_DIR/plugins/platforms/libqxcb.so" 2>/dev/null | grep -E "libxcb-cursor|libxcb-icccm|libxcb-image|libxcb-keysyms|libxcb-render|libxcb-shape|libxcb-shm|libxcb-sync|libxcb-util|libxcb-xfixes|libxcb-xinerama|libxcb-xkb" | awk '{print $3}' | sort -u | xargs -I {} cp {} "$DIST/lib/" 2>/dev/null || true

          # Script de lancement
          cat > "$DIST/run.sh" << 'EOF'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$HERE/plugins/platforms"
          exec "$HERE/CourseOrientation" "$@"
          EOF
          chmod +x "$DIST/run.sh" "$DIST/CourseOrientation"

          # README minimal
          cat > "$DIST/README.txt" << EOF
          CourseOrientation ${TAG} - Linux x86_64

          Lancement : ./run.sh

          Prerequis systeme :
            - Ubuntu 20.04+ ou distribution recente (glibc 2.31+)
            - libfontconfig1, libdbus-1
          EOF

          # Créer le tarball
          tar czf "${DIST}.tar.gz" "$DIST"
          echo "Tarball créé :"
          ls -lh "${DIST}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: CourseOrientation-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # GitHub Release (uniquement sur tag)
  # ───────────────────────────────────────────────────────────────────────────
  create-release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release

      - uses: actions/download-artifact@v4
        with:
          name: linux-release

      - name: Lister les artefacts
        run: ls -lh

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CourseOrientation ${{ github.ref_name }}"
          body: |
            ## CourseOrientation ${{ github.ref_name }}

            Application de gestion de courses d'orientation — Qt 6 / C++17.

            ### Téléchargements

            | Plateforme | Fichier | Installation |
            |---|---|---|
            | Windows 10/11 (x64) | `*.zip` | Extraire et lancer `CourseOrientation.exe` |
            | Linux x86_64 | `*.tar.gz` | Extraire puis `./run.sh` |

            Toutes les dépendances Qt sont incluses dans les archives.
          files: |
            CourseOrientation-*-windows-x64.zip
            CourseOrientation-*-linux-x86_64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
